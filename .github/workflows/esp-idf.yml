name: esp-idf

on:
  push:
    branches: [main]
    paths: ["mcu/esp-idf/**", ".github/workflows/esp-idf.yml"]
  pull_request:
    paths: ["mcu/esp-idf/**", ".github/workflows/esp-idf.yml"]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C mcu/esp-idf/test/host test

  build:
    runs-on: ubuntu-latest
    container: espressif/idf:${{ matrix.idf }}
    strategy:
      fail-fast: false
      matrix:
        idf: [v5.5.6]
        target: [esp32, esp32s2, esp32s3, esp32c3, esp32c6]
        include:
          - idf: v5.3.6
            target: esp32c3
    steps:
      - uses: actions/checkout@v4
      - name: Build examples
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          TARGETS=${{ matrix.target }} mcu/esp-idf/test/build-all.sh
