name: ingest

on:
  push:
    branches: [main]
    paths: ["services/ingest/**", ".github/workflows/ingest.yml"]
  pull_request:
    paths: ["services/ingest/**", ".github/workflows/ingest.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/ingest/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:workers
